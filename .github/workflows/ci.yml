name: RaktSetu CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: local
      SECRET_KEY: ci-secret-key-for-testing-only-32chars
      JWT_SECRET_KEY: ci-jwt-secret-key-for-testing-only
      DATABASE_BACKEND: sqlite
      SQLITE_DB_PATH: instance/blood_platform.db
      STORAGE_BACKEND: local
      UPLOAD_FOLDER: uploads
      EMAIL_BACKEND: console
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize and seed SQLite database
        run: |
          python scripts/init_db.py
          python scripts/seed_data.py

      - name: Run backend unit tests
        run: pytest tests/test_unit.py -v

      - name: Run live E2E and edge-case tests
        run: |
          python -c "from app import create_app; create_app().run(host='127.0.0.1', port=5000, debug=False)" &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          python tests/test_e2e_scenario.py
          python tests/test_edge_cases.py

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:5000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build
